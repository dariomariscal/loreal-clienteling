# fly.toml — L'Oreal Clienteling API
# Deploy from the repo root:
#   fly deploy -c apps/api/fly.toml
# Set the app name with `fly apps create <name>` and update `app` below.

app = "loreal-clienteling-api"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

# Run migrations on every deploy, before swapping traffic to the new release.
# We use the workspace-aware migrate runner so Neon pooled URLs work.
[deploy]
  # Runs Drizzle migrations against the production database before traffic
  # swaps to the new release. The script handles cd-ing into apps/api so
  # Node resolves drizzle-orm / pg from the hoisted node_modules.
  release_command = "/usr/local/bin/release.sh"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
